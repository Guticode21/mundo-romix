<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mundo Romix - Panel de Control 👑</title>
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body { background: var(--crema); color: var(--vinotinto); }
    .admin-container { max-width: 500px; margin: 0 auto; padding: 20px; }
    .admin-header { text-align: center; margin-bottom: 30px; }
    .admin-section-title { font-weight: 700; color: var(--vinotinto); margin-bottom: 15px; display: flex; align-items: center; gap: 10px; font-size: 1.1rem; }
    .input-group { background: white; border: 1px solid var(--oro); border-radius: 12px; padding: 10px; display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
    .input-field { border: none; outline: none; width: 100%; font-size: 1rem; color: var(--vinotinto); }
    .btn-full { width: 100%; padding: 15px; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; }
    .btn-save { background: var(--vinotinto); color: white; border: none; }
    .btn-save:hover { background: #5e0b15; transform: translateY(-2px); }
    .chat-container { height: 250px; overflow-y: auto; background: rgba(0,0,0,0.05); border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--oro); }
    .msg { padding: 10px 15px; border-radius: 18px; max-width: 85%; font-size: 0.9rem; line-height: 1.4; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .msg-guti { align-self: flex-end; background: var(--vinotinto); color: white; border-bottom-right-radius: 4px; }
    .msg-fabi { align-self: flex-start; background: white; color: var(--vinotinto); border-bottom-left-radius: 4px; border: 1px solid var(--oro); }
  </style>
</head>
<body>

  <div class="admin-container">
    <div class="admin-header">
      <h1 style="color:var(--vinotinto); font-family:'Outfit', sans-serif">Hola, Guti 👑</h1>
      <p style="color:var(--oro); font-weight:600">Control Central de Mundo Romix</p>
    </div>

    <!-- CONFIGURACIÓN DE CONTENIDO -->
    <div class="glass-card fade-in" style="padding:22px; margin-bottom:20px;">
      <div class="admin-section-title"><i class="fa-solid fa-heart"></i> MENSAJE DEL DÍA</div>
      <textarea id="adminMensaje" class="input-field" placeholder="Escribe tu mensaje de amor aquí..." style="height:80px; background:rgba(0,0,0,0.03); padding:10px; border-radius:8px; border:1px solid var(--oro); margin-bottom:15px; width:100%; font-family:inherit;"></textarea>

      <div class="admin-section-title"><i class="fa-solid fa-file-pdf"></i> ENLACE HITOS (PDF)</div>
      <div class="input-group">
        <i class="fa-solid fa-link"></i>
        <input type="text" id="adminPdf" class="input-field" placeholder="Pega el link del PDF aquí...">
      </div>

      <div class="admin-section-title"><i class="fa-solid fa-images"></i> GALERÍA (LINKS)</div>
      <div class="input-group">
        <i class="fa-solid fa-camera"></i>
        <input type="text" id="adminFotos" class="input-field" placeholder="Link1, Link2, Link3...">
      </div>

      <button class="btn btn-save btn-full" onclick="guardarCambios()">
        <i class="fa-solid fa-cloud-arrow-up"></i> ACTUALIZAR TODO
      </button>
    </div>

    <!-- CHAT EN TIEMPO REAL -->
    <div class="glass-card fade-in" style="padding:22px;">
      <div class="admin-section-title"><i class="fa-solid fa-comments"></i> CHAT CON FABI</div>
      <div id="chatContainer" class="chat-container"></div>
      <div style="display:flex; gap:8px; margin-top:15px;">
        <input type="text" id="chatInput" class="input-field" placeholder="Dile algo lindo..." style="background:white; border:1px solid var(--oro); border-radius:25px; padding:12px 20px" onkeypress="if(event.key==='Enter') mandarMensaje()">
        <button class="btn-save" onclick="mandarMensaje()" style="width:50px; height:50px; border-radius:50%; border:none; cursor:pointer">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </div>
    </div>

    <button class="btn btn-outline btn-full mt-16" onclick="cerrarSesion()" style="border:1px solid var(--vinotinto); background:none; color:var(--vinotinto)">
      <i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión
    </button>
  </div>

  <!-- SCRIPTS DE FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="js/app.js"></script>
  <script src="js/firebase-config.js"></script>

  <script>
    const usuarioActual = protegerPagina('Guti');
    
    if(usuarioActual){
      // 1. CARGAR CONFIGURACIÓN DESDE FIREBASE
      db.ref('config').on('value', (snapshot) => {
        const datos = snapshot.val();
        if(datos){
          document.getElementById('adminMensaje').value = datos.mensaje || '';
          document.getElementById('adminPdf').value = datos.pdfUrl || '';
          document.getElementById('adminFotos').value = datos.fotos || '';
        }
      });

      // 2. CHAT EN TIEMPO REAL
      db.ref('chat').limitToLast(20).on('value', (snapshot) => {
        const container = document.getElementById('chatContainer');
        container.innerHTML = '';
        snapshot.forEach((child) => {
          const msg = child.val();
          const div = document.createElement('div');
          div.className = `msg msg-${msg.usuario.toLowerCase()}`;
          div.textContent = msg.texto;
          container.appendChild(div);
        });
        container.scrollTop = container.scrollHeight;
      });

      window.mandarMensaje = () => {
        const input = document.getElementById('chatInput');
        if(input.value.trim()){
          enviarChat('Guti', input.value);
          input.value = '';
        }
      };

      window.guardarCambios = function() {
        const mensaje = document.getElementById('adminMensaje').value.trim();
        const pdfUrl = document.getElementById('adminPdf').value.trim();
        const fotos = document.getElementById('adminFotos').value.trim();
        
        actualizarConfig({ mensaje, pdfUrl, fotos });
        alert('✅ ¡Mundo Romix actualizado!');
      };

      window.cerrarSesion = function() {
        localStorage.removeItem('mr_usuario');
        window.location.href = 'index.html';
      };
    }
  </script>
</body>
</html>
