<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mundo Romix — Iniciar sesión</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#5e0b15" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Mundo Romix" />
  <link rel="apple-touch-icon" href="img/logo.png" />
  <meta name="description" content="El espacio privado de Romix. Inicia sesión para entrar." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="css/estilos.css" />
  <style>
    /* Estilos específicos del login */
    .login-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 20px;
    }

    .login-card {
      width: 100%;
      max-width: 380px;
      padding: 40px 30px 36px;
      animation: fadeIn 0.6s ease both;
    }

    .corazones-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .corazon-bg-item {
      position: absolute;
      font-size: 1.2rem;
      opacity: 0.12;
      animation: floatHeart linear infinite;
    }

    @keyframes floatHeart {
      0% {
        transform: translateY(110vh) rotate(0deg);
        opacity: 0;
      }

      10% {
        opacity: 0.12;
      }

      90% {
        opacity: 0.12;
      }

      100% {
        transform: translateY(-10vh) rotate(360deg);
        opacity: 0;
      }
    }

    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.8rem;
      color: rgba(94, 11, 21, 0.5);
    }

    .login-footer i {
      color: var(--oro);
    }

    .toggle-pass {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--oro);
      cursor: pointer;
      font-size: 1rem;
      padding: 4px;
    }
  </style>
</head>

<body>

  <!-- Corazones flotantes decorativos -->
  <div class="corazones-bg" id="corazonesBg"></div>

  <div class="login-wrap">
    <div class="glass-card login-card">

      <!-- Logo / Marca -->
      <div class="logo-marca">
        <span class="logo-icono">
          <img src="img/logo.png" alt="Logo Mundo Romix"
            style="width: 80px; height: 80px; border-radius: 20px; object-fit: cover; box-shadow: var(--sombra);">
        </span>
        <h1>Mundo Romix</h1>
        <p>Nuestro espacio, nuestra historia 💫</p>
      </div>

      <!-- Mensaje de error -->
      <div id="loginError" class="alert alert-error hidden">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="loginErrorMsg">Usuario o contraseña incorrectos.</span>
      </div>

      <!-- Formulario -->
      <form id="loginForm" novalidate>

        <div class="input-group">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="usuario" class="input-field" placeholder="Tu nombre..." autocomplete="username"
            required />
        </div>

        <div class="input-group">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="password" class="input-field" placeholder="Contraseña..."
            autocomplete="current-password" required />
          <button type="button" class="toggle-pass" id="togglePass" aria-label="Mostrar/ocultar contraseña">
            <i class="fa-solid fa-eye" id="togglePassIcon"></i>
          </button>
        </div>

        <button type="submit" class="btn btn-primary btn-full mt-8" id="btnLogin">
          <i class="fa-solid fa-door-open"></i>
          Entrar a nuestro mundo
        </button>

      </form>

      <div class="login-footer">
        <i class="fa-solid fa-shield-heart"></i>
        Espacio privado · Solo para nosotros
      </div>

    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Eliminar Service Worker para evitar cachés viejos
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister();
        }
      }).catch(function(err) {
        console.log('Service Worker unregistration failed: ', err);
      });
    }
  </script>
  <script>
    // === CORAZONES FLOTANTES ===
    (function crearCorazones() {
      const container = document.getElementById('corazonesBg');
      const emojis = ['♥', '✿', '❀', '♡', '✦', '★'];
      for (let i = 0; i < 18; i++) {
        const el = document.createElement('span');
        el.className = 'corazon-bg-item';
        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        el.style.left = `${Math.random() * 100}%`;
        el.style.animationDuration = `${8 + Math.random() * 12}s`;
        el.style.animationDelay = `${Math.random() * 10}s`;
        el.style.fontSize = `${0.8 + Math.random() * 1.4}rem`;
        container.appendChild(el);
      }
    })();

    // === TOGGLE CONTRASEÑA ===
    document.getElementById('togglePass').addEventListener('click', function () {
      const input = document.getElementById('password');
      const icon = document.getElementById('togglePassIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-solid fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fa-solid fa-eye';
      }
    });

    // === LOGIN CON FIREBASE AUTH ===
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const usuario = document.getElementById('usuario').value.trim();
      const pass = document.getElementById('password').value.trim();
      const errorEl = document.getElementById('loginError');
      const btn = document.getElementById('btnLogin');

      errorEl.classList.add('hidden');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Entrando...';

      // Normalizar nombre de usuario
      const userClean = usuario.toLowerCase() === 'fabi' ? 'Fabi' : (usuario.toLowerCase() === 'guti' ? 'Guti' : usuario);
      const email = userClean.toLowerCase() + '@mundoromix.com';

      if (userClean !== 'Fabi' && userClean !== 'Guti') {
        errorEl.classList.remove('hidden');
        document.getElementById('loginErrorMsg').textContent = 'Usuario no reconocido. Solo Fabi o Guti. 💔';
        resetBtn();
        return;
      }

      // Intentar iniciar sesión
      auth.signInWithEmailAndPassword(email, pass)
        .then((userCredential) => {
          if (typeof window.guardarSesion === 'function') {
            window.guardarSesion(userClean);
          }
          localStorage.setItem('mr_usuario', userClean);
          window.location.href = 'dashboard.html';
        })
        .catch((error) => {
          // Si el usuario no existe, o las credenciales no cuadran (puede ser primera vez), intentamos crearlo
          if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-login-credentials' || error.code === 'auth/invalid-credential') {
             auth.createUserWithEmailAndPassword(email, pass)
               .then(() => {
                 if (typeof window.guardarSesion === 'function') {
                   window.guardarSesion(userClean);
                 }
                 localStorage.setItem('mr_usuario', userClean);
                 window.location.href = 'dashboard.html';
               })
               .catch((createError) => {
                 if (createError.code === 'auth/email-already-in-use') {
                    mostrarError('Contraseña incorrecta. Inténtalo de nuevo. 💔');
                 } else if (createError.code === 'auth/weak-password') {
                    mostrarError('La contraseña debe tener al menos 6 caracteres.');
                 } else {
                    // Muestra error exacto de Firebase (ej. auth/operation-not-allowed si no activaste el proveedor)
                    mostrarError('Error de Firebase: ' + createError.message);
                 }
               });
          } else {
             mostrarError('Error de Firebase: ' + error.message);
          }
        });

      function mostrarError(msg) {
        errorEl.classList.remove('hidden');
        document.getElementById('loginErrorMsg').textContent = msg;
        resetBtn();
      }

      function resetBtn() {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-door-open"></i> Entrar a nuestro mundo';
      }
    });
  </script>
</body>

</html>
